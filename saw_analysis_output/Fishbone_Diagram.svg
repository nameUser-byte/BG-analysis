  <text x="430" y="386" text-anchor="middle" font-size="10" fill="#9A3412">⚠ 현재 데이터 미포함: Spindle Run-out 측정값, Chuck 진동 이력, Blade ID별 이력, 클린룸 환경 데이터</text>
