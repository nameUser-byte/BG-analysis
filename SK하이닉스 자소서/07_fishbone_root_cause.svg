<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A8A" />
    </marker>
    <marker id="branch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12" />
  
  <!-- Main Spine -->
  <line x1="50" y1="250" x2="680" y2="250" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)" />
  
  <!-- Effect (Problem) Box -->
  <rect x="690" y="210" width="190" height="80" fill="#DC2626" rx="8" />
  <text x="785" y="245" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">출하 TTV 불량</text>
  <text x="785" y="270" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">&amp; 깊은 Crack(SSD)</text>

  <!-- Top Branches: Material & Machine -->
  <!-- Material -->
  <line x1="150" y1="100" x2="350" y2="250" stroke="#3B82F6" stroke-width="4" marker-end="url(#branch-arrow)" />
  <rect x="90" y="60" width="140" height="40" fill="#1E40AF" rx="4" />
  <text x="160" y="86" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Material (자재)</text>
  
  <line x1="130" y1="150" x2="216" y2="150" stroke="#64748B" stroke-width="2" />
  <text x="125" y="155" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">입고 TTV 불량 (휜 웨이퍼)</text>

  <line x1="180" y1="200" x2="283" y2="200" stroke="#64748B" stroke-width="2" />
  <text x="175" y="205" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">Wafer 로트간 편차</text>

  <!-- Machine -->
  <line x1="400" y1="100" x2="600" y2="250" stroke="#3B82F6" stroke-width="4" marker-end="url(#branch-arrow)" />
  <rect x="340" y="60" width="140" height="40" fill="#1E40AF" rx="4" />
  <text x="410" y="86" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Machine (설비)</text>

  <line x1="380" y1="150" x2="466" y2="150" stroke="#64748B" stroke-width="2" />
  <text x="375" y="155" fill="#DC2626" font-family="'Malgun Gothic', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Rough Grinding 압력(P) 과다</text>

  <line x1="430" y1="200" x2="533" y2="200" stroke="#64748B" stroke-width="2" />
  <text x="425" y="205" fill="#DC2626" font-family="'Malgun Gothic', sans-serif" font-size="14" font-weight="bold" text-anchor="end">회전 속도(V) 과다 (Preston)</text>

  <!-- Bottom Branches: Method & Environment -->
  <!-- Method -->
  <line x1="150" y1="400" x2="350" y2="250" stroke="#3B82F6" stroke-width="4" marker-end="url(#branch-arrow)" />
  <rect x="90" y="400" width="140" height="40" fill="#1E40AF" rx="4" />
  <text x="160" y="426" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Method (방법)</text>

  <line x1="130" y1="350" x2="216" y2="350" stroke="#64748B" stroke-width="2" />
  <text x="125" y="355" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">거친 연삭 비중 불균형</text>

  <line x1="180" y1="300" x2="283" y2="300" stroke="#64748B" stroke-width="2" />
  <text x="175" y="305" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">입고 TTV 맞춤형 제어 부재</text>

  <!-- Environment -->
  <line x1="400" y1="400" x2="600" y2="250" stroke="#3B82F6" stroke-width="4" marker-end="url(#branch-arrow)" />
  <rect x="340" y="400" width="140" height="40" fill="#1E40AF" rx="4" />
  <text x="410" y="426" fill="white" font-family="'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Measurement (측정)</text>

  <line x1="380" y1="350" x2="466" y2="350" stroke="#64748B" stroke-width="2" />
  <text x="375" y="355" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">인라인(In-line) SSD 센싱 불가</text>

  <line x1="430" y1="300" x2="533" y2="300" stroke="#64748B" stroke-width="2" />
  <text x="425" y="305" fill="#1E293B" font-family="'Malgun Gothic', sans-serif" font-size="14" text-anchor="end">장비별 P/V 센서 로그 누락</text>

</svg>
